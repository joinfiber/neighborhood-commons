name: SDK Publish

# Tag-triggered SDK publish to npm.
#
# To release: bump sdk/package.json version, commit, then:
#   git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
#
# This workflow regenerates types from the spec on master, builds the SDK,
# and publishes to npm with provenance. The version published is whatever
# is in sdk/package.json at the tagged commit — keep them in sync.
#
# Setup once: add NPM_TOKEN as a repo secret. Use an Automation token
# (Settings → Access Tokens → Generate New Token → Automation), which
# bypasses 2FA for CI publishing.

on:
  push:
    tags:
      - 'sdk-v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install SDK dependencies
        run: npm ci
        working-directory: ./sdk

      - name: Build SDK (regenerate from spec + tsc)
        run: npm run build
        working-directory: ./sdk

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        working-directory: ./sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
